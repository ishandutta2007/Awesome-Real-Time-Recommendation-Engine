<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4}}@keyframes nodePulse{0%{r:5px;opacity:.6}}@keyframes floatSmooth{0%{transform:translateY(0)}}.bg-pulse{animation:pulseGlow 6s ease-in-out infinite alternate}.node-pulse{animation:nodePulse 3s ease-in-out infinite alternate}.flow-line{stroke-dasharray:12,12;animation:dashMove 20s linear infinite}.float-item,.float-item-delayed{animation:floatSmooth 4s ease-in-out infinite alternate}.float-item-delayed{animation-delay:-2s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="90" r="180" fill="#4f46e5" class="bg-pulse" filter="url(#softGlow)" opacity=".25"/><circle cx="1050" cy="270" r="200" fill="#c026d3" class="bg-pulse" filter="url(#softGlow)" opacity=".2"/><g stroke="#fff" stroke-width="1" opacity=".08"><path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/></g><g fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity=".4"><path d="M 50,40 Q 300,80 600,30 T 1150,50" class="flow-line"/><path d="M 50,320 Q 350,280 600,330 T 1150,310" class="flow-line"/></g><g fill="#06b6d4"><circle cx="200" cy="50" class="node-pulse"/><circle cx="1000" cy="55" class="node-pulse"/><circle cx="150" cy="310" class="node-pulse"/><circle cx="1080" cy="305" class="node-pulse"/></g><g class="float-item" transform="translate(60, 160)"><rect width="160" height="44" fill="url(#cardGrad)" stroke="url(#cyanGlow)" stroke-width="1.5" rx="22"/><circle cx="26" cy="22" r="6" fill="#06b6d4"/><text x="42" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Real-Time ML</text></g><g class="float-item-delayed" transform="translate(980, 160)"><rect width="160" height="44" fill="url(#cardGrad)" stroke="url(#primaryGlow)" stroke-width="1.5" rx="22"/><circle cx="26" cy="22" r="6" fill="#ec4899"/><text x="42" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Vector Search</text></g><g transform="translate(600, 75)"><rect width="280" height="32" x="-140" y="-16" fill="url(#primaryGlow)" opacity=".25" rx="16"/><rect width="280" height="32" x="-140" y="-16" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" rx="16"/><text x="0" y="5" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">PRODUCTION READY &amp; OPEN SOURCE</text></g><text x="600" y="155" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Real-Time Recommendation Engine</text><text x="600" y="155" fill="url(#primaryGlow)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" opacity=".3" text-anchor="middle">Awesome Real-Time Recommendation Engine</text><text x="600" y="202" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing=".5" text-anchor="middle">Curated SaaS Platforms, Deep Learning Recommenders &amp; Vector Search Ecosystem</text><rect width="300" height="4" x="450" y="225" fill="url(#primaryGlow)" filter="url(#glow)" rx="2"/><g><text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" transform="translate(600, 265)">Collaborative Filtering <tspan fill="#6366f1">•</tspan> Neural Recommenders <tspan fill="#a855f7">•</tspan> Hybrid Personalization <tspan fill="#ec4899">•</tspan> Vector DBs</text></g></svg>